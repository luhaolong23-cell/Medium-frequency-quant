[project]
name = "quant-platform"
version = "0.1.0"
description = "Single-repo skeleton for global market regime detection"
requires-python = ">=3.11"
dependencies = [
  "apscheduler>=3.10,<4.0",
  "fastapi>=0.115,<1.0",
  "httpx>=0.28,<1.0",
  "pydantic>=2.7,<3.0",
  "pyyaml>=6.0,<7.0",
  "uvicorn>=0.30,<1.0",
  "yfinance>=0.2.65,<1.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = []

[tool.setuptools.packages.find]
include = ["apps*", "packages*", "services*"]
